---
name: zabbix-agent

services:
  zabbix-agent:
    image: zabbix/zabbix-agent2:${ZABBIX_AGENT_TAG:-ol-7.0-latest}
    container_name: zabbix-agent
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - ${ZABBIX_AGENT_DOCKER_GROUPID:-985}
    environment:
      TZ: ${ZABBIX_AGENT_TZ:-America/Sao_Paulo}
      ZBX_SERVER_HOST: ${ZABBIX_AGENT_SERVER_HOST}
      ZBX_HOSTNAME: ${ZABBIX_AGENT_HOSTNAME}
    volumes:
      - ${ZABBIX_AGENT_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:z
    read_only: true
    network_mode: host
    pid: host
    restart: unless-stopped
